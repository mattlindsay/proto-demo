<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Woolworths – Atoms Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#008446;--dk:#25251f;--gt:#616c71;--bd:#e8e8e8;--w:#fff;--bg:#f5f5f5;--pg:#eee;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
/* Must beat the display:flex rules below, or [hidden] elements stay visible */
[hidden]{display:none!important;}
body{font-family:'Roboto',sans-serif;color:var(--dk);background:var(--bg);-webkit-font-smoothing:antialiased;padding:40px;}
h1{font-size:20px;margin-bottom:24px;}
.preview{max-width:520px;display:flex;flex-direction:column;gap:16px;}

/* ===== CONTROL PANEL ===== */
.control-panel{position:fixed;top:24px;right:24px;z-index:10;width:260px;background:var(--w);border:1px solid var(--bd);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 4px 16px rgba(0,0,0,.08);}
.control-panel h2{font-size:14px;font-weight:700;margin-bottom:4px;}
.control{display:flex;flex-direction:column;gap:6px;}
.control label{font-size:12px;font-weight:500;color:var(--gt);}
.control input{font-family:inherit;font-size:14px;color:var(--dk);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;background:var(--bg);}
.control input:focus{outline:2px solid var(--g);outline-offset:-1px;}
.control-toggle{flex-direction:row;align-items:center;justify-content:space-between;}
.control-toggle label{font-size:14px;font-weight:500;color:var(--dk);}
/* Nested controls that only apply while their parent toggle is on */
.control-group{display:flex;flex-direction:column;gap:12px;padding-left:12px;border-left:2px solid var(--bd);}
.control-group .control-toggle label{font-size:12px;font-weight:500;color:var(--gt);}
.control-checkbox{flex-direction:row;align-items:center;gap:8px;}
.control-checkbox input{width:auto;padding:0;accent-color:var(--g);}
.control-checkbox label{cursor:pointer;}

/* Toggle switch (Tailwind UI style) */
.toggle{position:relative;flex-shrink:0;width:44px;height:24px;padding:2px;border:none;border-radius:9999px;background:#e4e4e7;cursor:pointer;transition:background-color .2s ease;}
.toggle[aria-checked="true"]{background:var(--g);}
.toggle:focus-visible{outline:2px solid var(--g);outline-offset:2px;}
.toggle-thumb{display:block;width:20px;height:20px;border-radius:50%;background:var(--w);box-shadow:0 1px 3px rgba(0,0,0,.3);transform:translateX(0);transition:transform .2s ease;}
.toggle[aria-checked="true"] .toggle-thumb{transform:translateX(20px);}

/* ===== ATOM: Cart Tile ===== */
.cart-tile{position:relative;display:flex;gap:16px;background:var(--w);border:1px solid var(--bd);border-radius:12px;padding:16px;}
.cart-tile-image{flex-shrink:0;align-self:flex-start;width:80px;height:80px;border-radius:4px;overflow:hidden;background:var(--pg);}
.cart-tile-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:8px;}
.cart-tile-title{font-size:16px;line-height:24px;color:var(--dk);padding-right:32px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.cart-tile-footer{display:flex;align-items:center;gap:16px;}

.cart-tile-tags{display:flex;flex-wrap:wrap;gap:4px;}
.tag{display:inline-flex;align-items:center;background:#ffda00;color:var(--dk);font-family:inherit;font-weight:700;font-size:12px;line-height:16px;padding:4px 8px;border-radius:4px;white-space:nowrap;}
.tag-online{background:#fffdd0;}
/* Points tag carries the (white) Everyday Rewards mark. */
.tag-points{background:#d44500;color:var(--w);padding-left:4px;gap:4px;}
.tag-points .tag-icon{width:16px;height:16px;flex-shrink:0;display:block;}

.cart-stepper{display:flex;align-items:center;flex:1;min-width:136px;max-width:194px;}
.cart-stepper button{width:36px;height:36px;flex-shrink:0;background:#f4f4f4;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.cart-stepper button:hover{background:#ebebeb;}
.cart-stepper button:disabled{opacity:.4;cursor:not-allowed;}
.cart-stepper button:disabled:hover{background:#f4f4f4;}
.cart-stepper .minus-stepper{border-radius:8px 0 0 8px;}
.cart-stepper .plus-stepper{border-radius:0 8px 8px 0;}
.cart-stepper .plus-stepper img{width:24px;height:24px;display:block;}
.cart-stepper .minus-stepper img{width:11.68px;height:1.78px;display:block;}
.cart-stepper input{flex:1;min-width:0;height:36px;border:1px solid var(--bd);border-left:none;border-right:none;background:#f4f4f4;text-align:center;font-family:inherit;font-size:14px;font-weight:500;color:var(--dk);-moz-appearance:textfield;}
.cart-stepper input::-webkit-outer-spin-button,
.cart-stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

.cart-tile-price-block{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;}
.cart-tile-price{white-space:nowrap;font-family:inherit;font-size:24px;font-weight:500;color:var(--dk);}
.cart-tile-price .symbol{font-size:14px;font-weight:700;vertical-align:top;position:relative;top:5px;margin-right:1px;}
.cart-tile-was{font-size:14px;line-height:20px;color:var(--dk);white-space:nowrap;}
.cart-tile-was .was-amount{text-decoration:line-through;}

.cart-tile-remove{position:absolute;top:-1px;right:-1px;width:48px;height:48px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.cart-tile-remove .circle{width:24px;height:24px;border-radius:50%;background:#f5f6f6;display:flex;align-items:center;justify-content:center;transition:background .15s ease;}
.cart-tile-remove:hover .circle{background:#e5e6e6;}
.cart-tile-remove img{width:12px;height:12px;}
</style>
</head>
<body>

<h1>Atoms — Cart Tile</h1>

<div class="preview">
  <div class="cart-tile">
    <div class="cart-tile-image"></div>
    <div class="cart-tile-body">
      <div class="cart-tile-tags">
        <span class="tag" data-tag="save">Save $3.50</span>
        <span class="tag tag-online" data-tag="online" hidden>Online only</span>
        <span class="tag tag-points" data-tag="points" hidden><img class="tag-icon" src="images/icon-everyday-rewards.svg" alt=""><span class="points-value">10 pts</span></span>
      </div>
      <div class="cart-tile-title">Product title</div>
      <div class="cart-tile-footer">
        <div class="cart-stepper">
          <button type="button" class="minus-stepper" aria-label="Decrease quantity">
            <img src="images/icon-minus.svg" alt="">
          </button>
          <input type="text" inputmode="numeric" value="1" aria-label="Quantity">
          <button type="button" class="plus-stepper" aria-label="Increase quantity">
            <img src="images/icon-plus.svg" alt="">
          </button>
        </div>
        <div class="cart-tile-price-block">
          <div class="cart-tile-price"><span class="symbol">$</span><span class="amount">2.90</span></div>
          <div class="cart-tile-was" hidden>Was <span class="was-amount">$5.70</span></div>
        </div>
      </div>
    </div>
    <button type="button" class="cart-tile-remove" aria-label="Remove item">
      <span class="circle"><img src="images/icon-close.svg" alt=""></span>
    </button>
  </div>
</div>

<div class="control-panel">
  <h2>Cart Tile controls</h2>
  <div class="control">
    <label for="ctrl-title">Product title</label>
    <input type="text" id="ctrl-title" value="Product title">
  </div>
  <div class="control">
    <label for="ctrl-price">Unit price ($)</label>
    <input type="number" id="ctrl-price" value="2.90" min="0" step="0.01">
  </div>
  <div class="control control-toggle">
    <label id="ctrl-savings-on-label">Has Savings</label>
    <button type="button" class="toggle" id="ctrl-savings-on" role="switch" aria-checked="false" aria-labelledby="ctrl-savings-on-label">
      <span class="toggle-thumb"></span>
    </button>
  </div>
  <div class="control-group" id="ctrl-savings-fields" hidden>
    <div class="control">
      <label for="ctrl-was">Was unit price ($)</label>
      <input type="number" id="ctrl-was" value="5.70" min="0" step="0.01">
    </div>
    <div class="control control-checkbox">
      <input type="checkbox" id="ctrl-online">
      <label for="ctrl-online">Online only</label>
    </div>
  </div>
  <div class="control control-toggle">
    <label id="ctrl-points-on-label">Has Points</label>
    <button type="button" class="toggle" id="ctrl-points-on" role="switch" aria-checked="false" aria-labelledby="ctrl-points-on-label">
      <span class="toggle-thumb"></span>
    </button>
  </div>
  <div class="control-group" id="ctrl-points-fields" hidden>
    <div class="control">
      <label for="ctrl-points">Points</label>
      <input type="number" id="ctrl-points" value="10" min="10" max="100000" step="10">
    </div>
  </div>
</div>

<script>
(function(){
  document.querySelectorAll('.cart-tile').forEach(function(tile){
    var minus = tile.querySelector('.minus-stepper');
    var plus = tile.querySelector('.plus-stepper');
    var input = tile.querySelector('.cart-stepper input');
    var remove = tile.querySelector('.cart-tile-remove');
    var titleEl = tile.querySelector('.cart-tile-title');
    var amountEl = tile.querySelector('.cart-tile-price .amount');
    var tagsRow = tile.querySelector('.cart-tile-tags');
    var saveTag = tile.querySelector('[data-tag="save"]');
    var onlineTag = tile.querySelector('[data-tag="online"]');
    var pointsTag = tile.querySelector('[data-tag="points"]');
    var pointsValueEl = tile.querySelector('[data-tag="points"] .points-value');
    var wasRow = tile.querySelector('.cart-tile-was');
    var wasAmountEl = tile.querySelector('.cart-tile-was .was-amount');
    var MIN = 1;

    var savingsOn = document.getElementById('ctrl-savings-on');
    var savingsFields = document.getElementById('ctrl-savings-fields');
    var wasCtrl = document.getElementById('ctrl-was');
    var onlineCtrl = document.getElementById('ctrl-online');
    var pointsOn = document.getElementById('ctrl-points-on');
    var pointsFields = document.getElementById('ctrl-points-fields');
    var pointsCtrl = document.getElementById('ctrl-points');

    var POINTS_MIN = 10, POINTS_MAX = 100000, POINTS_STEP = 10;

    // unitPrice is the per-item price set in the control panel; the tile
    // always displays unitPrice * qty as the line total. wasUnitPrice is
    // only meaningful while the Savings toggle is on.
    var unitPrice = parseFloat(document.getElementById('ctrl-price').value) || 0;

    function round2(n){ return Math.round(n * 100) / 100; }

    // A savings tile must always save at least 1c, so the Was price can
    // never sit at or below the unit price.
    function minWasPrice(){ return round2(unitPrice + 0.01); }

    // Snaps the Was field itself to a valid value. Called when the value is
    // committed (blur/step) or when the unit price moves out from under it —
    // never mid-keystroke, so typing isn't fought.
    function clampWasField(){
      var min = minWasPrice();
      var v = parseFloat(wasCtrl.value);
      if (isNaN(v) || v < min) { v = min; }
      wasCtrl.value = v.toFixed(2);
      wasCtrl.min = min.toFixed(2);
    }

    // Points are always a round 10 within range. Like the Was field, this
    // snaps the input only once the value is committed, not mid-keystroke.
    function clampPointsField(){
      pointsCtrl.value = clampPoints(parseInt(pointsCtrl.value, 10), true);
    }

    function clampPoints(v, snap){
      if (isNaN(v)) { v = POINTS_MIN; }
      if (snap) { v = Math.round(v / POINTS_STEP) * POINTS_STEP; }
      return Math.min(POINTS_MAX, Math.max(POINTS_MIN, v));
    }

    function render(){
      var qty = parseInt(input.value, 10) || MIN;
      amountEl.textContent = (unitPrice * qty).toFixed(2);

      var showSavings = savingsOn.getAttribute('aria-checked') === 'true';
      if (showSavings) {
        // Clamp for display only, so a half-typed Was price can never render
        // a negative saving before the field snaps on blur.
        var wasUnitPrice = Math.max(parseFloat(wasCtrl.value) || 0, minWasPrice());
        var savingsPerUnit = wasUnitPrice - unitPrice;
        saveTag.textContent = 'Save $' + (savingsPerUnit * qty).toFixed(2);
        wasAmountEl.textContent = '$' + (wasUnitPrice * qty).toFixed(2);
      }
      // Each tag owns its own visibility, since the row can now be opened by
      // savings or points independently.
      saveTag.hidden = !showSavings;
      // The Online only tag is a sub-option of savings — it never shows on
      // its own. Points are independent of savings.
      onlineTag.hidden = !(showSavings && onlineCtrl.checked);

      var showPoints = pointsOn.getAttribute('aria-checked') === 'true';
      if (showPoints) {
        // Points are a per-product label, so they don't scale with qty.
        var pts = clampPoints(parseInt(pointsCtrl.value, 10), false);
        pointsValueEl.textContent = pts.toLocaleString('en-AU') + ' pts';
      }
      pointsTag.hidden = !showPoints;

      tagsRow.hidden = !(showSavings || showPoints);
      wasRow.hidden = !showSavings;
    }

    function setQty(v){
      v = Math.max(MIN, v);
      input.value = v;
      minus.disabled = (v <= MIN);
      render();
    }

    minus.addEventListener('click', function(){
      setQty((parseInt(input.value, 10) || MIN) - 1);
    });
    plus.addEventListener('click', function(){
      setQty((parseInt(input.value, 10) || MIN) + 1);
    });
    input.addEventListener('change', function(){
      setQty(parseInt(input.value, 10) || MIN);
    });

    // Preview-only: removes the tile from view. Real cart removal wires up
    // once this atom is composed into the cart flyout.
    remove.addEventListener('click', function(){
      tile.remove();
    });

    // ===== CONTROL PANEL =====
    // Wire up controls to the (currently single) preview tile. As more
    // controls are added, extend this the same way.
    document.getElementById('ctrl-title').addEventListener('input', function(e){
      titleEl.textContent = e.target.value;
    });
    document.getElementById('ctrl-price').addEventListener('input', function(e){
      unitPrice = parseFloat(e.target.value) || 0;
      // Raising the unit price can invalidate the Was price — pull it back up.
      if (savingsOn.getAttribute('aria-checked') === 'true') { clampWasField(); }
      render();
    });

    // Toggling Savings on/off reveals/hides the Was-price field and, via
    // render(), the savings tag + Was price line on the tile itself.
    savingsOn.addEventListener('click', function(){
      var next = savingsOn.getAttribute('aria-checked') !== 'true';
      savingsOn.setAttribute('aria-checked', String(next));
      savingsFields.hidden = !next;
      // Turning it on seeds the Was price at $1.00 above the unit price.
      if (next) {
        wasCtrl.value = round2(unitPrice + 1).toFixed(2);
        wasCtrl.min = minWasPrice().toFixed(2);
      }
      render();
    });
    wasCtrl.addEventListener('input', render);
    wasCtrl.addEventListener('change', function(){
      clampWasField();
      render();
    });
    onlineCtrl.addEventListener('change', render);

    // Points mirrors the savings toggle: reveals its own field and seeds a
    // starting value of 10 pts.
    pointsOn.addEventListener('click', function(){
      var next = pointsOn.getAttribute('aria-checked') !== 'true';
      pointsOn.setAttribute('aria-checked', String(next));
      pointsFields.hidden = !next;
      if (next) { pointsCtrl.value = POINTS_MIN; }
      render();
    });
    pointsCtrl.addEventListener('input', render);
    pointsCtrl.addEventListener('change', function(){
      clampPointsField();
      render();
    });

    setQty(parseInt(input.value, 10) || MIN);
  });
})();
</script>

</body>
</html>
