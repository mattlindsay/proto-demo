<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Woolworths – Atoms Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#008446;--dk:#25251f;--gt:#616c71;--bd:#e8e8e8;--w:#fff;--bg:#f5f5f5;--pg:#eee;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Roboto',sans-serif;color:var(--dk);background:var(--bg);-webkit-font-smoothing:antialiased;padding:40px;}
h1{font-size:20px;margin-bottom:24px;}
.preview{max-width:520px;display:flex;flex-direction:column;gap:16px;}

/* ===== CONTROL PANEL ===== */
.control-panel{position:fixed;top:24px;right:24px;z-index:10;width:260px;background:var(--w);border:1px solid var(--bd);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 4px 16px rgba(0,0,0,.08);}
.control-panel h2{font-size:14px;font-weight:700;margin-bottom:4px;}
.control{display:flex;flex-direction:column;gap:6px;}
.control label{font-size:12px;font-weight:500;color:var(--gt);}
.control input{font-family:inherit;font-size:14px;color:var(--dk);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;background:var(--bg);}
.control input:focus{outline:2px solid var(--g);outline-offset:-1px;}

/* ===== ATOM: Cart Tile ===== */
.cart-tile{position:relative;display:flex;gap:16px;background:var(--w);border:1px solid var(--bd);border-radius:12px;padding:16px;}
.cart-tile-image{flex-shrink:0;align-self:flex-start;width:80px;height:80px;border-radius:4px;overflow:hidden;background:var(--pg);}
.cart-tile-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:8px;}
.cart-tile-title{font-size:16px;line-height:24px;color:var(--dk);padding-right:32px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.cart-tile-footer{display:flex;align-items:center;gap:16px;}

.cart-stepper{display:flex;align-items:center;flex:1;min-width:136px;max-width:194px;}
.cart-stepper button{width:36px;height:36px;flex-shrink:0;background:#f4f4f4;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.cart-stepper button:hover{background:#ebebeb;}
.cart-stepper button:disabled{opacity:.4;cursor:not-allowed;}
.cart-stepper button:disabled:hover{background:#f4f4f4;}
.cart-stepper .minus-stepper{border-radius:8px 0 0 8px;}
.cart-stepper .plus-stepper{border-radius:0 8px 8px 0;}
.cart-stepper .plus-stepper img{width:24px;height:24px;display:block;}
.cart-stepper .minus-stepper img{width:11.68px;height:1.78px;display:block;}
.cart-stepper input{flex:1;min-width:0;height:36px;border:1px solid var(--bd);border-left:none;border-right:none;background:#f4f4f4;text-align:center;font-family:inherit;font-size:14px;font-weight:500;color:var(--dk);-moz-appearance:textfield;}
.cart-stepper input::-webkit-outer-spin-button,
.cart-stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

.cart-tile-price{margin-left:auto;white-space:nowrap;font-family:inherit;font-size:24px;font-weight:500;color:var(--dk);}
.cart-tile-price .symbol{font-size:14px;font-weight:700;vertical-align:top;position:relative;top:5px;margin-right:1px;}

.cart-tile-remove{position:absolute;top:-1px;right:-1px;width:48px;height:48px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.cart-tile-remove .circle{width:24px;height:24px;border-radius:50%;background:#f5f6f6;display:flex;align-items:center;justify-content:center;transition:background .15s ease;}
.cart-tile-remove:hover .circle{background:#e5e6e6;}
.cart-tile-remove img{width:12px;height:12px;}
</style>
</head>
<body>

<h1>Atoms — Cart Tile</h1>

<div class="preview">
  <div class="cart-tile">
    <div class="cart-tile-image"></div>
    <div class="cart-tile-body">
      <div class="cart-tile-title">Product title</div>
      <div class="cart-tile-footer">
        <div class="cart-stepper">
          <button type="button" class="minus-stepper" aria-label="Decrease quantity">
            <img src="images/icon-minus.svg" alt="">
          </button>
          <input type="text" inputmode="numeric" value="1" aria-label="Quantity">
          <button type="button" class="plus-stepper" aria-label="Increase quantity">
            <img src="images/icon-plus.svg" alt="">
          </button>
        </div>
        <div class="cart-tile-price"><span class="symbol">$</span><span class="amount">2.90</span></div>
      </div>
    </div>
    <button type="button" class="cart-tile-remove" aria-label="Remove item">
      <span class="circle"><img src="images/icon-close.svg" alt=""></span>
    </button>
  </div>
</div>

<div class="control-panel">
  <h2>Cart Tile controls</h2>
  <div class="control">
    <label for="ctrl-title">Product title</label>
    <input type="text" id="ctrl-title" value="Product title">
  </div>
  <div class="control">
    <label for="ctrl-price">Unit price ($)</label>
    <input type="number" id="ctrl-price" value="2.90" min="0" step="0.01">
  </div>
</div>

<script>
(function(){
  document.querySelectorAll('.cart-tile').forEach(function(tile){
    var minus = tile.querySelector('.minus-stepper');
    var plus = tile.querySelector('.plus-stepper');
    var input = tile.querySelector('.cart-stepper input');
    var remove = tile.querySelector('.cart-tile-remove');
    var titleEl = tile.querySelector('.cart-tile-title');
    var amountEl = tile.querySelector('.cart-tile-price .amount');
    var MIN = 1;

    // unitPrice is the per-item price set in the control panel; the tile
    // always displays unitPrice * qty as the line total.
    var unitPrice = parseFloat(document.getElementById('ctrl-price').value) || 0;

    function render(){
      var qty = parseInt(input.value, 10) || MIN;
      amountEl.textContent = (unitPrice * qty).toFixed(2);
    }

    function setQty(v){
      v = Math.max(MIN, v);
      input.value = v;
      minus.disabled = (v <= MIN);
      render();
    }

    minus.addEventListener('click', function(){
      setQty((parseInt(input.value, 10) || MIN) - 1);
    });
    plus.addEventListener('click', function(){
      setQty((parseInt(input.value, 10) || MIN) + 1);
    });
    input.addEventListener('change', function(){
      setQty(parseInt(input.value, 10) || MIN);
    });

    // Preview-only: removes the tile from view. Real cart removal wires up
    // once this atom is composed into the cart flyout.
    remove.addEventListener('click', function(){
      tile.remove();
    });

    // ===== CONTROL PANEL =====
    // Wire up controls to the (currently single) preview tile. As more
    // controls are added, extend this the same way.
    document.getElementById('ctrl-title').addEventListener('input', function(e){
      titleEl.textContent = e.target.value;
    });
    document.getElementById('ctrl-price').addEventListener('input', function(e){
      unitPrice = parseFloat(e.target.value) || 0;
      render();
    });

    setQty(parseInt(input.value, 10) || MIN);
  });
})();
</script>

</body>
</html>
